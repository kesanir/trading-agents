name: EC2 OIDC and SSM preflight

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: trading-agents-ec2-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      AWS_PAGER: ''
    steps:
      - name: Validate destination
        shell: bash
        run: |
          set -euo pipefail
          test "$AWS_REGION" = us-west-1
          test "$EC2_INSTANCE_ID" = i-03dd5367b7d6c8060
          test "$AWS_DEPLOY_ROLE_ARN" = arn:aws:iam::667437688715:role/GitHubActions-TradingAgents-Deploy
      - name: Check out deployment controls
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Assume deployment role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: '667437688715'
          role-session-name: trading-agents-${{ github.run_id }}
      # Activation requires a successful live safety check first. This initial
      # workflow cannot update EC2 code or dependencies on any event.
      - name: Send preflight and wait for its actual result
        env:
          PREFLIGHT_ONLY: 'true'
        shell: bash
        run: bash .github/deploy/send-ssm.sh
