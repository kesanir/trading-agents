name: Activate EC2 position monitor
on:
  push:
    branches: [main]
    paths: [.github/workflows/position-monitor-activation.yml]
permissions:
  contents: read
  id-token: write
concurrency:
  group: trading-agents-ec2-production
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      AWS_PAGER: ''
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: '667437688715'
          action-timeout-s: 60
          retry-max-attempts: 2
      - name: Verify and activate five-minute paper/dry-run monitor
        shell: bash
        run: |
          set -euo pipefail
          test "$EC2_INSTANCE_ID" = i-03dd5367b7d6c8060
          test "$AWS_REGION" = us-west-1
          python3 - <<'PY'
          import json, pathlib
          command = r'''bash -s <<'POSITION_MONITOR_ACTIVATE'
          #!/usr/bin/env bash
          set -euo pipefail
          exec 9>/run/lock/trading-agents-deploy.lock
          flock -w 60 9
          cd /opt/trading-agents
          runuser -u ubuntu -- git merge-base --is-ancestor d6a8bfc0909fa6008707877400fb04185d6de8c3 HEAD
          runuser -u ubuntu -- git diff --quiet
          runuser -u ubuntu -- git diff --cached --quiet
          python3 .github/deploy/verify-reporting-units.py
          for unit in trading-agents-monitor.timer trading-agents-monitor.service; do
            state=$(systemctl is-active "$unit" 2>/dev/null || true)
            case "$state" in inactive|failed|unknown) ;; *) echo "$unit already active; no duplicate activation." >&2; exit 1;; esac
          done
          enabled=$(systemctl is-enabled trading-agents-monitor.timer 2>/dev/null || true)
          case "$enabled" in disabled|not-found) ;; *) echo 'Unexpected monitor timer state.' >&2; exit 1;; esac
          cron_text=$(runuser -u ubuntu -- crontab -l 2>/dev/null || true)
          if printf '%s\n' "$cron_text" | sed '/^[[:space:]]*#/d' | grep -Eq 'position_monitor_job\.py|app\.services\.trading_runner'; then
            echo 'Potential duplicate monitor cron job; activation stopped.' >&2; exit 1
          fi
          runuser -u ubuntu -- .venv/bin/python -m pip check
          runuser -u ubuntu -- .venv/bin/python -m unittest discover -s deployment_tests -v
          runuser -u ubuntu -- env ALPACA_PAPER=True DRY_RUN=True .venv/bin/python -c 'from app.services.deployment_safety import check_safety; check_safety()'
          systemd-analyze verify deploy/systemd/trading-agents-monitor.service deploy/systemd/trading-agents-monitor.timer
          backup="/var/backups/trading-agents-monitor/$(date -u +%Y%m%dT%H%M%SZ)"
          install -d -m 700 "$backup"
          for kind in service timer; do
            unit="trading-agents-monitor.$kind"
            if [[ -e "/etc/systemd/system/$unit" ]]; then cp -a "/etc/systemd/system/$unit" "$backup/"; fi
            install -m 644 "deploy/systemd/$unit" "/etc/systemd/system/$unit"
          done
          echo "Prior monitor units backed up at $backup"
          systemctl daemon-reload
          python3 .github/deploy/verify-reporting-units.py
          trap 'systemctl disable --now trading-agents-monitor.timer' ERR
          systemctl enable --now trading-agents-monitor.timer
          systemctl is-enabled trading-agents-monitor.timer
          systemctl is-active trading-agents-monitor.timer
          python3 .github/deploy/verify-reporting-units.py
          trap - ERR
          systemctl list-timers --all 'trading-*' --no-pager
          echo 'EC2 position monitor enabled: weekdays 06:30 Pacific, every five minutes through 12:55; paper/dry-run only.'
          
          POSITION_MONITOR_ACTIVATE'''
          pathlib.Path('params.json').write_text(json.dumps({'commands':[command], 'executionTimeout':['300']}))
          PY
          id=$(aws ssm send-command --instance-ids "$EC2_INSTANCE_ID" --document-name AWS-RunShellScript --parameters file://params.json --query Command.CommandId --output text)
          echo "SSM command: $id"
          for attempt in $(seq 1 75); do
            if aws ssm get-command-invocation --command-id "$id" --instance-id "$EC2_INSTANCE_ID" > result.json 2> error.txt; then
              status=$(jq -r .Status result.json)
              case "$status" in Pending|InProgress|Delayed) ;; *) jq -r '.StandardOutputContent,.StandardErrorContent' result.json; test "$status" = Success; exit;; esac
            elif ! grep -q InvocationDoesNotExist error.txt; then cat error.txt; exit 1; fi
            sleep 5
          done
          exit 1
