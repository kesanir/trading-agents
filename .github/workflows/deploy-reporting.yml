name: Reporting safety checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ec2-reporting-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m pip check
      - name: Verify staging scripts and Linux units
        run: |
          for script in deploy/install.sh deploy/update.sh .github/deploy/*.sh; do bash -n "$script"; done
          systemd-analyze verify deploy/systemd/*
      - run: python -m unittest discover -s deployment_tests -v
