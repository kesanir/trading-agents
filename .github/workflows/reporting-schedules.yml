name: Reporting schedule inspection
on:
  push:
    branches: [main]
    paths: [.github/workflows/reporting-schedules.yml]
permissions:
  contents: read
  id-token: write
concurrency:
  group: trading-agents-ec2-production
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      AWS_PAGER: ''
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: '667437688715'
          action-timeout-s: 60
          retry-max-attempts: 2
      - name: Inspect current schedules without starting jobs
        shell: bash
        run: |
          set -euo pipefail
          test "$EC2_INSTANCE_ID" = i-03dd5367b7d6c8060
          test "$AWS_REGION" = us-west-1
          python3 - <<'PY'
          import json, pathlib
          command = '''set -eu
          systemctl list-timers --all 'trading-*' --no-pager
          systemctl list-unit-files 'trading-*' --no-pager
          for unit in trading-premarket.service trading-intraday-apmem.service trading-after-open.service trading-state-change.service trading-state.service trading-mnq.service; do
            echo "=== $unit ==="
            systemctl show "$unit" -p LoadState -p ActiveState -p FragmentPath -p DropInPaths -p User -p ExecStart --no-pager
          done
          systemctl cat trading-after-open.timer trading-premarket.timer trading-intraday-apmem.timer trading-state-change.timer --no-pager
          runuser -u ubuntu -- bash -c 'cd /opt/trading-agents && git rev-parse HEAD && .venv/bin/python -m pip check'
          '''
          pathlib.Path('params.json').write_text(json.dumps({'commands':[command], 'executionTimeout':['120']}))
          PY
          id=$(aws ssm send-command --instance-ids "$EC2_INSTANCE_ID" --document-name AWS-RunShellScript --parameters file://params.json --query Command.CommandId --output text)
          echo "SSM command: $id"
          for attempt in $(seq 1 30); do
            if aws ssm get-command-invocation --command-id "$id" --instance-id "$EC2_INSTANCE_ID" > result.json 2> error.txt; then
              status=$(jq -r .Status result.json)
              case "$status" in Pending|InProgress|Delayed) ;; *) jq -r '.StandardOutputContent,.StandardErrorContent' result.json; test "$status" = Success; exit;; esac
            elif ! grep -q InvocationDoesNotExist error.txt; then cat error.txt; exit 1; fi
            sleep 5
          done
          exit 1
